name: GUI verification toolchain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verification-toolchain.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip download --only-binary=:all: --dest wheels PySide6 pyqtgraph ruff pytest-qt
      - uses: actions/upload-artifact@v4
        with:
          name: gui-verification-wheels-py313-linux
          path: wheels/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
  wiki-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          import urllib.request, json, hashlib, re, time
          from pathlib import Path
          root = Path('wiki'); root.mkdir()
          urls = {'ammo-table':'https://www.eftarkov.com/news/web_33.html', 'fallback-ammo':'https://raw.githubusercontent.com/TarkovTracker/tarkovdata/master/ammunition.json', 'ammo-chart':'https://eft-ammo.vercel.app/'}
          for n in range(5707,5711):
              urls[str(n)] = f'https://www.eftarkov.com/news/{n}.html'
          manifest = {}
          for name, url in urls.items():
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 EFT-Calculator reference audit'})
                  raw = urllib.request.urlopen(req, timeout=45).read()
                  (root / (name + '.txt')).write_bytes(raw)
                  manifest[name] = {'url':url, 'sha256':hashlib.sha256(raw).hexdigest()}
              except Exception as exc:
                  manifest[name] = {'url':url, 'error':str(exc)}
              time.sleep(1)
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: independent-wiki-reference
          path: wiki/
          if-no-files-found: error
          retention-days: 30

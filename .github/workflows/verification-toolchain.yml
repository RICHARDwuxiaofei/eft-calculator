name: GUI verification toolchain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verification-toolchain.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download --only-binary=:all: --dest wheels PySide6 pyqtgraph ruff pytest-qt
      - uses: actions/upload-artifact@v4
        with:
          name: gui-verification-wheels-py313-linux
          path: wheels/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

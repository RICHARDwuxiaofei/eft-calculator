name: Public data audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/data-audit.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture catalog and item-specific evidence
        run: |
          python -u - <<'PY'
          import json, hashlib, urllib.request, re, concurrent.futures, datetime
          from pathlib import Path
          root = Path('artifacts/catalog'); root.mkdir(parents=True)
          def fetch(url, timeout=6):
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 EFT-Calculator reference audit'})
              return urllib.request.urlopen(req, timeout=timeout).read()
          manifest = {'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'files':{}}
          ids = set()
          pages = {key:f'https://www.eftarkov.com/news/{key}.html' for key in ['web_33','web_40','web_37','web_38']}
          pages['chart'] = 'https://eft-ammo.vercel.app/'
          for page, url in pages.items():
              try:
                  raw = fetch(url, 20); (root / (page+'.html')).write_bytes(raw)
                  manifest['files'][page] = {'url':url, 'sha256':hashlib.sha256(raw).hexdigest()}
                  if page in ['web_33','web_40']:
                      ids.update(re.findall(r'/news/id/([a-f0-9]{24})\.html',raw.decode(errors='replace')))
              except Exception as exc:
                  manifest['files'][page] = {'url':url, 'error':str(exc)}
          print('Catalog identities:',len(ids),flush=True)
          def item(item_id):
              errors = []
              for url in [f'https://assets.tarkov.dev/{item_id}-icon.webp', f'https://img.eftarkov.com/upFiles/512/{item_id}-512.webp']:
                  try:
                      raw = fetch(url)
                      if not (raw.startswith(b'RIFF') or raw.startswith(b'\x89PNG')):
                          raise ValueError('Non-image response')
                      (root / (item_id+'.webp')).write_bytes(raw)
                      return item_id, {'icon':{'url':url, 'sha256':hashlib.sha256(raw).hexdigest()}}
                  except Exception as exc:
                      errors.append({'url':url, 'error':str(exc)})
              return item_id, {'errors':errors}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for n, (item_id, result) in enumerate(pool.map(item, sorted(ids)), 1):
                  manifest['files'][item_id] = result
                  if n % 25 == 0: print('Checked',n,flush=True)
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print('Images:',len(list(root.glob('*.webp'))),flush=True)
          PY
      - name: Retain source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-catalog-source
          path: artifacts/catalog/
          if-no-files-found: error
          retention-days: 30

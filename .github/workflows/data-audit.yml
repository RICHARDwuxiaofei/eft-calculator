name: Public data audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/data-audit.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture catalog and item-specific evidence
        run: |
          python - <<'PY'
          import json, hashlib, urllib.request, re, time, concurrent.futures, datetime
          from pathlib import Path
          root = Path('artifacts/catalog'); root.mkdir(parents=True)
          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (EFT Calculator data audit)'})
              return urllib.request.urlopen(req, timeout=30).read()
          manifest = {'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'files':{}}
          ids = set()
          for page in ['web_33', 'web_40', 'web_37', 'web_38']:
              url = f'https://www.eftarkov.com/news/{page}.html'
              try:
                  raw = fetch(url); (root / (page+'.html')).write_bytes(raw)
                  manifest['files'][page] = {'url':url, 'sha256':hashlib.sha256(raw).hexdigest()}
                  if page in ['web_33','web_40']:
                      ids.update(re.findall(r'/news/id/([a-f0-9]{24})\.html',raw.decode(errors='replace')))
              except Exception as exc:
                  manifest['files'][page] = {'url':url, 'error':str(exc)}
          def item(item_id):
              result = {}
              for kind, url in [('detail', f'https://www.eftarkov.com/itemdetail/{item_id}.js'), ('icon',f'https://assets.tarkov.dev/{item_id}-icon.webp')]:
                  try:
                      raw = fetch(url)
                      if kind=='icon' and not (raw.startswith(b'RIFF') or raw.startswith(b'\x89PNG')):
                          raise ValueError('Non-image response')
                      suffix = '.js' if kind=='detail' else '.webp'
                      (root / (item_id+suffix)).write_bytes(raw)
                      result[kind] = {'url':url, 'sha256':hashlib.sha256(raw).hexdigest()}
                  except Exception as exc:
                      result[kind] = {'url':url, 'error':str(exc)}
                  time.sleep(.3)
              return item_id,result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              for item_id, result in pool.map(item, sorted(ids)):
                  manifest['files'][item_id] = result
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print('Catalog items:',len(ids))
          print('Images:',len(list(root.glob('*.webp'))))
          print('Details:',len(list(root.glob('*.js'))))
          PY
      - name: Retain source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-catalog-source
          path: artifacts/catalog/
          if-no-files-found: error
          retention-days: 30

name: Windows build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -p no:cacheprovider

      - name: Build Windows application
        run: python tools/build_windows.py

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/TarkovArmorSimulator/*" `
            -DestinationPath "dist/EFT-Calculator-Windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EFT-Calculator-Windows-x64
          path: dist/EFT-Calculator-Windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: EFT Calculator 1.0.0
          generate_release_notes: true
          make_latest: true
          files: dist/EFT-Calculator-Windows-x64.zip


name: Apply verified correctness repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-verified-repair.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: apply-verified-repair
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve immutable reviewed source delta
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repair"
          : > "$RUNNER_TEMP/repair/delta.json.xz"
          for sha in 6e53cc5c65022b742f71a2808b60c310e7391fa8 49e9a47d4bda3a31ff798cbcd10e3feb119682b9 5888d3cc2aa69fc3777a371bd2842fb99c1effa1 ac17427689736a7599427b7add4a1f6358edc088 31259784216a60e082cd9cb842d183c7c288fe34 e345eadad32559695bd9d5dcf7a8bea4c1345208 b6ef7c5734ceff9b066ea4fa829bc1fb202363fa 3e4942468bc795c03adcca5bf36c15692d4f1279 c2dc32521a5f4483c0537e2b7b9fb53fe162b11b 03749f6347bdfff431b550b80783b14fa6d27460; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 -d >> "$RUNNER_TEMP/repair/delta.json.xz"
          done
          echo "0f39ec1a596773b6dbb5ebdf2e9f420ff1ace6498e6842c6e5ba4178573f46fd  $RUNNER_TEMP/repair/delta.json.xz" | sha256sum -c
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10429738892/zip" > "$RUNNER_TEMP/repair/wiki.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10430033914/zip" > "$RUNNER_TEMP/repair/catalog.zip"
          echo "1175c25a9f210225e0c659f8abdb4d30849851583a898f191b4eff639d799a28  $RUNNER_TEMP/repair/wiki.zip" | sha256sum -c
          echo "a4d5b333d75f0ff325eb0593cdc28e9630869c2933801549dcb6c05851d0e72c  $RUNNER_TEMP/repair/catalog.zip" | sha256sum -c
      - name: Validate every old and new file hash before applying
        run: |
          python - <<'PY'
          import hashlib, json, lzma, os, zipfile
          from pathlib import Path
          staging = Path(os.environ['RUNNER_TEMP']) / 'repair'
          payload = json.loads(lzma.decompress((staging/'delta.json.xz').read_bytes()))
          pending = []
          for name, item in payload.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert not path.parts[0].startswith('.'), 'No workflow or git metadata writes allowed'
              old = path.read_bytes() if path.exists() else b''
              if item['base'] is None:
                  assert not path.exists(), 'New path already exists: '+name
              else:
                  actual = hashlib.sha1(b'blob '+str(len(old)).encode()+b'\0'+old).hexdigest()
                  assert actual == item['base'], 'Baseline changed: '+name
              lines = old.decode('utf-8').splitlines(keepends=True)
              text = ''.join(part if isinstance(part,str) else ''.join(lines[part[0]:part[1]]) for part in item['segments'])
              raw = text.encode('utf-8')
              assert hashlib.sha256(raw).hexdigest() == item['sha256'], 'Output mismatch: '+name
              pending.append((path, raw))
          for path, raw in pending:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
          for kind in ['wiki','catalog']:
              target = staging / kind
              target.mkdir()
              with zipfile.ZipFile(staging/(kind+'.zip')) as archive:
                  for entry in archive.infolist():
                      rel = Path(entry.filename)
                      assert not rel.is_absolute() and '..' not in rel.parts
                  archive.extractall(target)
          (staging/'paths.json').write_text(json.dumps(list(payload)))
          print('Applied and verified', len(pending), 'source files')
          PY
      - name: Install verification dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 fonts-noto-cjk
          python -m pip install -e '.[dev]'
      - name: Reproduce catalog and exact item images from pinned evidence
        run: |
          python tools/build_verified_catalog.py --source-dir "$RUNNER_TEMP/repair/wiki" --armor-dir "$RUNNER_TEMP/repair/catalog"
          echo '4e5dda1650a004d027c5aa7231d1ed286194882cb4c1d5e2da568fda7937a796  src/tarkov_armor_sim/resources/items/catalog.json' | sha256sum -c
          echo 'e83354b85ba4526d06c9489dccc33b846a5fe27ab166f08b0526c0417ad47f5f  src/tarkov_armor_sim/resources/items/image-manifest.json' | sha256sum -c
      - name: Independently re-run all regression and UI checks
        run: |
          ruff check .
          pytest --junitxml=artifacts/pytest.xml
          python tools/verify_ui.py
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: applied-repair-verification
          path: artifacts/
          if-no-files-found: warn
      - name: Commit directly to main only if the remote has not changed
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths = json.loads((Path(os.environ['RUNNER_TEMP'])/'repair/paths.json').read_text())
          paths += ['src/tarkov_armor_sim/resources/items/catalog.json', 'src/tarkov_armor_sim/resources/items/image-manifest.json', 'src/tarkov_armor_sim/resources/items/ammo-live', 'src/tarkov_armor_sim/resources/items/armor-live']
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: correct ballistics, all-hit shotguns, current catalog and responsive desktop/android UI'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" -f ref=main
